<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBX Scene - Interactive Textures</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }

        /* Glassmorphism UI Container */
        #ui-layer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        /* Glass Button Base Style */
        .glass-btn {
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transform: translateY(-5px);
        }

        /* Pulsing Animation for Order Button */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(136, 204, 255, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(136, 204, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(136, 204, 255, 0); }
        }

        .order-btn {
            background: rgba(136, 204, 255, 0.2);
            border: 1px solid rgba(136, 204, 255, 0.5);
            animation: pulse 2s infinite;
        }

        /* Floating Label from original code */
        #glass-info {
            position: absolute;
            display: none;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            text-align: center;
            pointer-events: none;
            transform: translate(-50%, -100%);
            z-index: 50;
        }
    </style>
</head>
<body>
    <div id="glass-info">
        <h2>Object Loaded</h2>
        <p>Animation Playing</p>
    </div>

    <div id="ui-layer">
        <div id="switch-tex-btn" class="glass-btn">Switch Style</div>
        <div id="order-btn" class="glass-btn order-btn">Order on Amazon</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        let camera, scene, renderer, controls, mixer, hoodieModel;
        let currentTextureIndex = 1;
        const clock = new THREE.Clock();
        const labelDiv = document.getElementById('glass-info');
        let labelPosition3D = new THREE.Vector3();

        const textureLoader = new THREE.TextureLoader();
        
        // Pre-load textures for smooth switching
        const tex1 = textureLoader.load('drag3_diffuse_1001.png');
        const tex2 = textureLoader.load('drag3_diffuse_1002.png');
        const normalTex = textureLoader.load('drag3_normal_1001.png');

        tex1.colorSpace = THREE.SRGBColorSpace;
        tex2.colorSpace = THREE.SRGBColorSpace;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
            sunLight.position.set(50, 100, 50);
            scene.add(sunLight);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(200, 200, 500);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // SkySphere
            const skyGeo = new THREE.SphereGeometry(5000, 32, 32);
            const skyMat = new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.BackSide });
            scene.add(new THREE.Mesh(skyGeo, skyMat));

            // Load FBX
            const fbxLoader = new FBXLoader();
            fbxLoader.load('clothanimation.fbx', (fbx) => {
                hoodieModel = fbx;
                
                applyTexture(tex1); // Initial texture

                mixer = new THREE.AnimationMixer(fbx);
                if (fbx.animations.length > 0) {
                    const action = mixer.clipAction(fbx.animations[0]);
                    action.play();
                }

                // Auto-Scale and Center
                const box = new THREE.Box3().setFromObject(fbx);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                fbx.position.sub(center); 
                
                labelPosition3D.set(0, size.y / 1.5, 0); 
                
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(maxDim, maxDim, maxDim * 1.5);
                controls.target.set(0, 0, 0);
                controls.update();

                scene.add(fbx);
                labelDiv.style.display = 'block';
            });

            // Button Event Listeners
            document.getElementById('switch-tex-btn').addEventListener('click', switchTexture);
            document.getElementById('order-btn').addEventListener('click', () => {
                window.open('https://www.amazon.com', '_blank');
            });

            window.addEventListener('resize', onWindowResize);
        }

        function applyTexture(texture) {
            if (!hoodieModel) return;
            hoodieModel.traverse((child) => {
                if (child.isMesh) {
                    child.material = new THREE.MeshStandardMaterial({
                        map: texture,
                        normalMap: normalTex,
                        roughness: 0.6,
                        metalness: 0.1
                    });
                }
            });
        }

        function switchTexture() {
            if (currentTextureIndex === 1) {
                applyTexture(tex2);
                currentTextureIndex = 2;
            } else {
                applyTexture(tex1);
                currentTextureIndex = 1;
            }
            console.log("Texture switched to: " + currentTextureIndex);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateLabel() {
            const vector = labelPosition3D.clone();
            vector.project(camera);
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
            labelDiv.style.left = `${x}px`;
            labelDiv.style.top = `${y}px`;
            labelDiv.style.opacity = vector.z > 1 ? 0 : 1;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            updateLabel();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
