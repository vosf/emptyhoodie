<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hoodie - Interactive Experience</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Inter', sans-serif; }
        canvas { display: block; }

        /* UI Container */
        #ui-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        /* Glassmorphism Button Style */
        .glass-btn {
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            font-size: 0.85rem;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Pulsing Order Button */
        .order-btn {
            background: rgba(0, 150, 255, 0.15);
            border: 1px solid rgba(0, 150, 255, 0.4);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 150, 255, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px 5px rgba(0, 150, 255, 0.2); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 150, 255, 0.4); }
        }

        /* Label Info */
        #glass-info {
            position: absolute;
            display: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
            pointer-events: none;
            transform: translate(-50%, -120%);
            z-index: 50;
        }
    </style>
</head>
<body>
    <div id="glass-info">
        <h2 style="margin:0; font-size: 1rem;">Empty Hoodie</h2>
        <p style="margin:5px 0 0; font-size: 0.75rem; opacity: 0.7;">3D Interactive View</p>
    </div>

    <div id="ui-container">
        <button id="tex-switch" class="glass-btn">Switch Color</button>
        <button id="amazon-btn" class="glass-btn order-btn">Order</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        let camera, scene, renderer, controls, mixer, hoodie;
        const clock = new THREE.Clock();
        const labelDiv = document.getElementById('glass-info');
        let labelPosition3D = new THREE.Vector3();

        const textureLoader = new THREE.TextureLoader();
        
        // Pre-load textures
        const tex1 = textureLoader.load('drag3_diffuse_1001.png');
        const tex2 = textureLoader.load('drag3_diffuse_1002.png');
        const normalTex = textureLoader.load('drag3_normal_1001.png');

        tex1.colorSpace = THREE.SRGBColorSpace;
        tex2.colorSpace = THREE.SRGBColorSpace;

        let activeTexture = tex1;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();

            // 1. Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
            sunLight.position.set(5, 10, 5);
            scene.add(sunLight);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(200, 200, 400);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.body.appendChild(renderer.domElement);

            // 4. Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 5. Load Hoodie FBX
            const fbxLoader = new FBXLoader();
            fbxLoader.load('clothanimation.fbx', (object) => {
                hoodie = object;
                
                updateHoodieMaterial(); // Apply initial material settings

                // Setup Animation
                mixer = new THREE.AnimationMixer(hoodie);
                if (hoodie.animations.length > 0) {
                    mixer.clipAction(hoodie.animations[0]).play();
                }

                // Center & Scale
                const box = new THREE.Box3().setFromObject(hoodie);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                hoodie.position.sub(center); 
                
                labelPosition3D.set(0, size.y / 2, 0); 
                
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(0, maxDim, maxDim * 1.5);
                controls.target.set(0, 0, 0);

                scene.add(hoodie);
                labelDiv.style.display = 'block';
            });

            // 6. Button Logic
            document.getElementById('tex-switch').addEventListener('click', () => {
                activeTexture = (activeTexture === tex1) ? tex2 : tex1;
                updateHoodieMaterial();
            });

            document.getElementById('amazon-btn').addEventListener('click', () => {
                window.open('https://www.amazon.com', '_blank');
            });

            window.addEventListener('resize', onWindowResize);
        }

        // --- THE FIX: DoubleSide prevents "disappearing" inside parts ---
        function updateHoodieMaterial() {
            if (!hoodie) return;
            hoodie.traverse((child) => {
                if (child.isMesh) {
                    child.material = new THREE.MeshStandardMaterial({
                        map: activeTexture,
                        normalMap: normalTex,
                        side: THREE.DoubleSide, // Crucial: Renders both sides of the mesh
                        roughness: 0.7,
                        metalness: 0.1
                    });
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();

            // Update floating label position
            if (hoodie) {
                const vector = labelPosition3D.clone();
                vector.project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
                labelDiv.style.left = `${x}px`;
                labelDiv.style.top = `${y}px`;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
